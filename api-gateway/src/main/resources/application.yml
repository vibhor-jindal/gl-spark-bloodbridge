server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: donor-service
          uri: lb://donor-service
          predicates:
            - Path=/api/donors/**

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/api/requests/**

        - id: matching-service
          uri: lb://matching-service
          predicates:
            - Path=/api/matches/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

bloodbridge:
  jwt:
    secret: ${JWT_SECRET:dev-only-bloodbridge-shared-secret-change-me-32bytes-minimum}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
