server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1629}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

  # -----------------------------------------------------------------
  # Real email delivery — free via Gmail SMTP + an App Password.
  # 1. Enable 2-Step Verification on the sending Gmail account.
  # 2. Generate an App Password: https://myaccount.google.com/apppasswords
  # 3. Set MAIL_USERNAME / MAIL_PASSWORD as environment variables.
  # -----------------------------------------------------------------
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:jindalvibhor183@gmail.com}
    password: ${MAIL_PASSWORD:xyfejluumwlvwdbe}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

bloodbridge:
  notifications:
    from-address: ${MAIL_USERNAME:noreply@bloodbridge.local}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.globallogic.bloodbridge.notification: INFO
