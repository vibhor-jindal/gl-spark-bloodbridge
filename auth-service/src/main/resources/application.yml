server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1629}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

bloodbridge:
  jwt:
    secret: ${JWT_SECRET:dev-only-bloodbridge-shared-secret-change-me-32bytes-minimum}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

logging:
  level:
    com.globallogic.bloodbridge.auth: INFO
