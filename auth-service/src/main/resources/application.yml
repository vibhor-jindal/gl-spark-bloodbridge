server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: 1629
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

bloodbridge:
  jwt:
    secret: dev-only-bloodbridge-shared-secret-change-me-32bytes-minimum
    expiration-seconds: 3600

logging:
  level:
    com.globallogic.bloodbridge.auth: INFO